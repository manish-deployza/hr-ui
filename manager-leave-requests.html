<!doctype html>
<html lang="en" data-auth-pending="true" data-access="manager">
<head>
  <meta charset="utf-8">
  <title>Leave Requests — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <div class="d-flex align-items-center justify-content-between pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2 mb-0">Leave Requests</h1>
          <button type="button" class="btn btn-outline-secondary" id="download-team-requests-csv">
            <i class="bi bi-download"></i> Download CSV
          </button>
        </div>
        <!-- The sidebar link is hidden for non-managers, but this page still
             loads for anyone who navigates here directly — the server is the
             real gate (returns 403 on the API call, shown below as an
             error), this page never decides authorization itself. -->
        <div id="team-requests-error" class="alert alert-danger" hidden></div>

        <div class="row g-2 mb-2">
          <div class="col-sm-3">
            <input type="text" id="filter-employee" class="form-control" list="filter-employee-options" placeholder="Employee" autocomplete="off">
            <datalist id="filter-employee-options"></datalist>
          </div>
          <div class="col-sm-3">
            <select id="filter-leave-type" class="form-select">
              <option value="">All leave types</option>
            </select>
          </div>
          <div class="col-sm-2">
            <select id="filter-status" class="form-select">
              <option value="">All statuses</option>
            </select>
          </div>
        </div>
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Employee</th><th>Leave type</th><th>Dates</th><th>Requested</th><th>Status</th></tr></thead>
              <tbody id="team-requests-body"></tbody>
            </table>
          </div>
        </div>
        <nav aria-label="Leave requests pagination">
          <ul class="pagination justify-content-center mt-3 mb-0" id="team-requests-pagination"></ul>
        </nav>

        <div class="modal fade app-modal" id="request-modal" tabindex="-1" aria-labelledby="request-modal-title" aria-hidden="true">
          <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h2 class="modal-title" id="request-modal-title">Request detail</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <dl class="row mb-3">
                  <dt class="col-4">Employee</dt><dd class="col-8" id="modal-detail-employee"></dd>
                  <dt class="col-4">Leave type</dt><dd class="col-8" id="modal-detail-type"></dd>
                  <dt class="col-4">Dates</dt><dd class="col-8" id="modal-detail-dates"></dd>
                  <dt class="col-4">Requested</dt><dd class="col-8" id="modal-detail-requested"></dd>
                  <dt class="col-4">Status</dt><dd class="col-8" id="modal-detail-status"></dd>
                  <dt class="col-4">Reason</dt><dd class="col-8" id="modal-detail-reason"></dd>
                </dl>
                <h3 class="h6">Approval timeline</h3>
                <div id="modal-approval-timeline"></div>
                <div id="modal-action-error" class="alert alert-danger mt-3" hidden></div>
              </div>
              <div class="modal-footer">
                <button id="modal-approve-btn" class="btn btn-success" hidden>Approve</button>
                <button id="modal-reject-btn" class="btn btn-outline-danger" hidden>Reject</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/status-badge.js"></script>
  <script src="js/approval-timeline.js"></script>
  <script src="js/request-filter.js"></script>
  <script src="js/csv-export.js"></script>
  <script src="js/api/manager-team-requests.js"></script>
</body>
</html>
