<!doctype html>
<html lang="en" data-auth-pending="true" data-access="admin">
<head>
  <meta charset="utf-8">
  <title>Settings — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">Settings</h1>
        <form id="org-form" class="card p-3" style="max-width: 480px;">
          <!-- key / status are set at provisioning and never
               editable here — see Prompts/multi-tenancy.md's OrgData table. -->
          <div class="mb-3">
            <label class="form-label" for="org-key">Organization Key</label>
            <input id="org-key" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label" for="org-status">Status</label>
            <input id="org-status" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label" for="org-name">Name</label>
            <input id="org-name" class="form-control" maxlength="255">
          </div>
          <div id="org-error" class="alert alert-danger" hidden></div>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </form>

      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/api/settings.js"></script>
</body>
</html>
