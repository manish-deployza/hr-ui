<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex flex-column align-items-center justify-content-center px-3" style="min-height: 100vh; background: var(--color-primary-hover);">
    <div class="mb-4 text-center">
      <div style="font-family: var(--font-display); font-weight: 600; font-size: 1.75rem; color: #fff; letter-spacing: -0.01em;">Employee Hub</div>
      <div class="small" style="color: rgba(255,255,255,0.7);">Time off, team, and reviews in one place</div>
    </div>
    <div class="card p-4 w-100" style="max-width: 360px;">
      <h1 class="h4 mb-3">Sign in</h1>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" required pattern="\w+@deployza\.com" title="Must be a deployza.com email address">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <div id="login-error" class="alert alert-danger" hidden></div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/api-client-mock.js"></script>
  <script src="js/api/api-router.js"></script>
  <script src="js/page/login.js"></script>
</body>
</html>
