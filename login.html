<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
    <div class="signin-card signin-card-plain">
      <h1 class="signin-title">Sign in to Employee Hub</h1>
      <div id="login-onboarded" class="alert alert-success" hidden>Thanks — your details were submitted. Sign in with your new password.</div>
      <form id="login-form">
        <div class="mb-3">
          <label for="org-key" class="form-label">Organization Key</label>
          <input type="text" id="org-key" class="form-control" required
                 pattern="[a-z0-9_-]{1,64}" title="Lowercase letters, digits, hyphens, and underscores only"
                 placeholder="acme_corp" autofocus>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="signin-password-wrap">
            <input type="password" id="password" class="form-control" placeholder="Your password" required>
            <button type="button" class="signin-toggle-password" data-target="password" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div id="login-org-warning" class="alert alert-warning mt-2" hidden>
          This organization is not registered. Please <a href="signup.html">register the account</a> and sign in again.
        </div>
        <div id="login-error" class="alert alert-danger mt-2" hidden></div>
        <div class="signin-actions">
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </div>
        <div id="recaptcha-badge-slot" class="recaptcha-badge-slot"></div>
        <div class="signin-links">
          <a href="forgot-password.html">Forgot your password?</a>
          <a href="signup.html">Sign Up</a>
        </div>
      </form>
    </div>
  </div>

  <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-content">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <p class="loading-message">Please wait…</p>
    </div>
  </div>
  <div id="notification-stack" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api/login.js"></script>
  <script src="js/auth-page.js"></script>
</body>
</html>
