<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>1:1 Session — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <div class="d-flex align-items-center justify-content-between pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2 mb-0">1:1 with <span id="session-other-party"></span></h1>
          <span id="session-status"></span>
        </div>
        <p class="text-body-secondary" id="session-scheduled-at"></p>

        <div id="session-error" class="alert alert-danger" hidden></div>

        <div class="card p-3 mb-3" style="max-width: 640px;">
          <label class="form-label" for="session-agenda">Shared agenda</label>
          <textarea id="session-agenda" class="form-control" rows="4"></textarea>
          <button id="save-agenda-btn" class="btn btn-outline-primary btn-sm mt-2 align-self-start">Save agenda</button>
        </div>

        <div id="notes-card" class="card p-3 mb-3" style="max-width: 640px;" hidden>
          <label class="form-label" for="session-notes">Private notes <span class="text-body-secondary fw-normal">(only you can see this)</span></label>
          <textarea id="session-notes" class="form-control" rows="4"></textarea>
          <button id="save-notes-btn" class="btn btn-outline-primary btn-sm mt-2 align-self-start">Save notes</button>
        </div>

        <h2 class="h6">Action items</h2>
        <ul class="list-group mb-3" id="action-items-list" style="max-width: 640px;"></ul>
        <form id="add-action-item-form" class="d-flex gap-2 mb-4" style="max-width: 640px;">
          <input type="text" id="new-action-item" class="form-control" placeholder="New action item" required>
          <button type="submit" class="btn btn-outline-secondary text-nowrap">Add</button>
        </form>

        <div id="session-action-buttons" class="d-flex gap-2" hidden>
          <button id="complete-btn" class="btn btn-success">Mark completed</button>
          <button id="cancel-btn" class="btn btn-outline-danger">Cancel session</button>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/status-badge.js"></script>
  <script src="js/api/one-on-one-view.js"></script>
</body>
</html>
