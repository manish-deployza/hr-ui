<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>All Leave Requests — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">All leave requests</h1>
        <!-- The sidebar link is shown to everyone for now (see components/sidebar.html);
             the server is the real gate (returns 403 on the API call, shown below as an
             error), this page never decides authorization itself. -->
        <div id="hr-requests-error" class="alert alert-danger" hidden></div>
        <div class="row g-2 mb-2">
          <div class="col-sm-3">
            <input type="text" id="filter-employee" class="form-control" list="filter-employee-options" placeholder="Employee" autocomplete="off">
            <datalist id="filter-employee-options"></datalist>
          </div>
          <div class="col-sm-3">
            <select id="filter-leave-type" class="form-select">
              <option value="">All leave types</option>
            </select>
          </div>
          <div class="col-sm-2">
            <select id="filter-status" class="form-select">
              <option value="">All statuses</option>
            </select>
          </div>
          <div class="col-sm-2">
            <input type="date" id="filter-date-from" class="form-control" aria-label="From date">
          </div>
          <div class="col-sm-2">
            <input type="date" id="filter-date-to" class="form-control" aria-label="To date">
          </div>
        </div>
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Employee</th><th>Leave type</th><th>Dates</th><th>Status</th><th></th></tr></thead>
              <tbody id="hr-requests-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/api-client-mock.js"></script>
  <script src="js/api/api-router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/status-badge.js"></script>
  <script src="js/request-filter.js"></script>
  <script src="js/page/hr-requests.js"></script>
</body>
</html>
