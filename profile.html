<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>Profile — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">Profile</h1>
        <form id="profile-form" style="max-width: 480px;">
          <!-- Name/email/role/employeeCode/employeeType are HR-managed
               (08-frontend-design.md: "own profile, read-only except
               contact details") — only phone/address are editable here. -->
          <h2 class="h5 mb-0 pb-2 border-bottom">Your details</h2>
          <div class="card p-3 mt-2 mb-4">
            <div class="profile-photo-row mb-3">
              <div class="profile-avatar-wrap">
                <img id="profile-photo" class="profile-avatar" alt="" hidden>
                <i id="profile-photo-placeholder" class="bi bi-person-circle profile-avatar-placeholder"></i>
              </div>
              <div>
                <label for="profile-photo-input" class="btn btn-sm btn-outline-secondary mb-0">
                  <i class="bi bi-camera" aria-hidden="true"></i> Change photo
                </label>
                <input type="file" id="profile-photo-input" accept="image/jpeg,image/png,image/webp" hidden>
                <button type="button" id="profile-photo-remove" class="btn btn-sm btn-outline-danger ms-2" hidden>Remove</button>
                <div id="profile-photo-error" class="alert alert-danger small mt-2 mb-0 py-1 px-2" hidden></div>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Employee code</label>
              <input id="profile-employee-code" class="form-control" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input id="profile-name" class="form-control" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input id="profile-email" class="form-control" disabled>
              <div id="profile-email-verified" class="form-text text-success" hidden>
                <i class="bi bi-patch-check-fill"></i> Verified
              </div>
              <div id="profile-email-unverified" class="form-text text-warning-emphasis" hidden>
                <i class="bi bi-envelope-exclamation"></i> Not verified —
                <a href="#" id="profile-resend-verification">resend verification email</a>
              </div>
            </div>
            <div class="mb-0">
              <label class="form-label">Role</label>
              <input id="profile-role" class="form-control" disabled>
            </div>
            <div class="mt-3 mb-0" id="profile-hr-address-wrap" hidden>
              <label class="form-label">Address on file (HR)</label>
              <textarea id="profile-hr-address" class="form-control" rows="3" disabled></textarea>
              <div class="form-text">Set by HR in the employee directory. Contact HR to update it.</div>
            </div>
          </div>

          <h2 class="h5 mb-0 pb-2 border-bottom">Contact details</h2>
          <div class="card p-3 mt-2">
            <div class="mb-3">
              <label class="form-label" for="profile-phone">Phone</label>
              <div class="input-group">
                <span class="input-group-text">🇮🇳 +91</span>
                <input type="tel" id="profile-phone" class="form-control" pattern="\d{10}" maxlength="10" placeholder="10-digit mobile number" title="Enter a 10-digit mobile number">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="profile-address">Address</label>
              <textarea id="profile-address" class="form-control" rows="2"></textarea>
            </div>
            <div id="profile-success" class="alert alert-success" hidden></div>
            <div id="profile-error" class="alert alert-danger" hidden></div>
            <button type="submit" class="btn btn-primary">Save contact details</button>
          </div>
        </form>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <!-- Crop/zoom preview shown after picking a file in the photo row above,
       before it's actually uploaded (js/api/profile.js). -->
  <div class="modal fade app-modal" id="photo-crop-modal" tabindex="-1" aria-labelledby="photo-crop-modal-title" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="photo-crop-modal-title">Adjust photo</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="photo-crop-viewport">
            <img id="photo-crop-image" alt="" src="">
          </div>
          <div class="form-text text-center mt-2">Drag to reposition, scroll or pinch to zoom.</div>
          <div id="photo-crop-error" class="alert alert-danger small mt-2 mb-0" hidden></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="photo-crop-upload" class="btn btn-primary">Upload</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/api/profile.js"></script>
</body>
</html>
