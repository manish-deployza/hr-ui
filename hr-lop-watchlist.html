<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>LOP Watchlist — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">LOP watchlist</h1>
        <p class="text-body-secondary">Employees whose 15-day LOP block has ended with no recorded return, flagged by the daily <code>LopReturnCheckJob</code>.</p>
        <div id="hr-lop-watchlist-error" class="alert alert-danger" hidden></div>
        <input type="search" class="form-control mb-2" style="max-width: 320px;" placeholder="Search employee…" data-filter-target="#hr-lop-watchlist-body tr">
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Employee</th><th>LOP dates</th><th>Flagged</th></tr></thead>
              <tbody id="hr-lop-watchlist-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/api-client-mock.js"></script>
  <script src="js/api/api-router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/list-filter.js"></script>
  <script src="js/page/hr-lop-watchlist.js"></script>
</body>
</html>
