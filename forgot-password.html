<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Forgot password — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
    <div class="signin-card">
      <div class="signin-brand"><i class="bi bi-key-fill"></i></div>
      <h1 class="signin-title">Forgot password?</h1>
      <p class="signin-subtitle">Enter your work email and we'll help you get back in</p>
      <form id="fyp-form">
        <div class="mb-3">
          <label class="form-label" for="org-key">Organization</label>
          <input type="text" id="org-key" class="form-control" required autofocus
                 pattern="[a-z0-9_-]{1,64}" title="Lowercase letters, digits, hyphens, and underscores only">
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div id="fyp-note" class="alert alert-info small" hidden></div>
        <div class="signin-actions">
          <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </div>
        <div id="recaptcha-badge-slot" class="recaptcha-badge-slot"></div>
        <div class="signin-forgot"><a href="login.html">Back to sign in</a></div>
      </form>
    </div>
  </div>

  <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-content">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <p class="loading-message">Please wait…</p>
    </div>
  </div>
  <div id="notification-stack" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-page.js"></script>
  <script src="js/api/forgot-password.js"></script>
</body>
</html>
