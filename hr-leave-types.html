<!doctype html>
<html lang="en" data-auth-pending="true" data-access="hr">
<head>
  <meta charset="utf-8">
  <title>Leave Types — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <div class="d-flex align-items-center justify-content-between pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2 mb-0">Leave types</h1>
          <button type="button" class="btn btn-primary" id="add-leave-type" data-bs-toggle="modal" data-bs-target="#leave-type-modal">
            <i class="bi bi-plus-lg"></i> Add leave type
          </button>
        </div>
        <div id="hr-leave-types-error" class="alert alert-danger" hidden></div>
        <div id="hr-leave-types-success" class="alert alert-success" hidden></div>
        <div class="card mb-3" style="max-width: 320px;">
          <div class="card-body">
            <div class="text-body-secondary small">Total entitlement (fixed-days types)</div>
            <div class="h2 mb-0" id="hr-leave-types-total">—</div>
          </div>
        </div>
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th></th><th>Name</th><th>Code</th><th>Entitlement</th><th>Advance notice</th><th>Notes</th></tr></thead>
              <tbody id="hr-leave-types-body"></tbody>
            </table>
          </div>
        </div>

        <!-- Add/Edit leave type popup — shared by the "Add leave type" button
             above and each row's name link (js/api/hr-leave-types.js). -->
        <div class="modal fade app-modal" id="leave-type-modal" tabindex="-1" aria-labelledby="leave-type-modal-title" aria-hidden="true">
          <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
              <div class="modal-header">
                <h2 class="modal-title" id="leave-type-modal-title">Add leave type</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form id="leave-type-form">
                  <div class="row g-3">
                    <div class="col-sm-6">
                      <label class="form-label" for="lt-name">Name</label>
                      <input type="text" id="lt-name" class="form-control" required>
                    </div>
                    <div class="col-sm-6">
                      <label class="form-label" for="lt-entitlement">Entitlement</label>
                      <input type="text" id="lt-entitlement" class="form-control" placeholder="e.g. 14 days/year">
                    </div>
                    <div class="col-sm-6">
                      <label class="form-label" for="lt-notice">Advance notice (days)</label>
                      <input type="number" id="lt-notice" class="form-control" min="0" step="1">
                    </div>
                    <div class="col-12">
                      <label class="form-label" for="lt-notes">Notes</label>
                      <textarea id="lt-notes" class="form-control" rows="2"></textarea>
                    </div>
                  </div>
                </form>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger me-auto" id="leave-type-delete" hidden><i class="bi bi-trash"></i> Delete</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="leave-type-form" class="btn btn-primary"><i class="bi bi-check-circle"></i> <span id="leave-type-submit-label">Add leave type</span></button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/api/hr-leave-types.js"></script>
</body>
</html>
