<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>Change password — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
    <div class="card p-4 w-100" style="max-width: 360px;">
      <h1 class="h4 mb-3">Set a new password</h1>
      <form id="change-password-form">
        <div class="mb-3">
          <label class="form-label" for="current-password">Current password</label>
          <input type="password" id="current-password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="new-password">New password</label>
          <input type="password" id="new-password" class="form-control" required>
        </div>
        <div id="change-password-error" class="alert alert-danger" hidden></div>
        <button type="submit" class="btn btn-primary w-100">Update password</button>
      </form>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/api-client-mock.js"></script>
  <script src="js/api/api-router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/page/change-password.js"></script>
</body>
</html>
