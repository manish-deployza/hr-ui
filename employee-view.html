<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>Employee Detail — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom" id="detail-name">Employee detail</h1>
        <div id="detail-error" class="alert alert-danger" hidden></div>

        <div class="card p-3 mb-3" style="max-width: 640px;">
          <dl class="row mb-0">
            <dt class="col-4">Employee ID</dt><dd class="col-8" id="detail-code"></dd>
            <dt class="col-4">Email</dt><dd class="col-8" id="detail-email"></dd>
            <dt class="col-4">Phone</dt><dd class="col-8" id="detail-phone"></dd>
            <dt class="col-4">Role</dt><dd class="col-8" id="detail-role"></dd>
            <dt class="col-4">Status</dt><dd class="col-8" id="detail-status"></dd>
            <dt class="col-4">Employee type</dt><dd class="col-8" id="detail-type"></dd>
            <dt class="col-4">Designation</dt><dd class="col-8" id="detail-designation"></dd>
            <dt class="col-4">Department</dt><dd class="col-8" id="detail-department"></dd>
            <dt class="col-4">Date of joining</dt><dd class="col-8" id="detail-doj"></dd>
            <dt class="col-4">Date of exit</dt><dd class="col-8" id="detail-doe"></dd>
            <dt class="col-4">Basic salary</dt><dd class="col-8" id="detail-salary"></dd>
            <dt class="col-4">Manager</dt><dd class="col-8" id="detail-manager"></dd>
          </dl>
        </div>

        <h2 class="h6">Direct reports</h2>
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
              <tbody id="detail-reports-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/team-roster.js"></script>
  <script src="js/api/employee-view.js"></script>
</body>
</html>
