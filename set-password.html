<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Set your password — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
    <div class="signin-card">
      <div class="signin-brand"><i class="bi bi-key-fill"></i></div>
      <h1 class="signin-title">Set your password</h1>
      <p class="signin-subtitle">Choose a password to activate your account</p>

      <form id="set-password-form">
        <div class="signin-password-wrap">
          <div class="form-floating has-icon">
            <i class="bi bi-lock field-icon"></i>
            <input type="password" id="password" class="form-control" placeholder="New password" required minlength="8">
            <label for="password">New password</label>
          </div>
          <button type="button" class="signin-toggle-password" data-target="password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <ul id="password-rules" class="list-unstyled small mb-3 mt-1" aria-live="polite"></ul>
        <div class="signin-password-wrap">
          <div class="form-floating has-icon">
            <i class="bi bi-lock field-icon"></i>
            <input type="password" id="confirm-password" class="form-control" placeholder="Confirm password" required minlength="8">
            <label for="confirm-password">Confirm password</label>
          </div>
          <button type="button" class="signin-toggle-password" data-target="confirm-password" aria-label="Show password">
            <i class="bi bi-eye"></i>
          </button>
        </div>

        <div id="set-password-error" class="alert alert-danger" hidden></div>
        <div class="signin-actions">
          <span></span>
          <button type="submit" class="btn btn-primary">Continue</button>
        </div>
      </form>
    </div>
  </div>

  <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-content">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <p class="loading-message">Please wait…</p>
    </div>
  </div>
  <div id="notification-stack" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/password-checks.js"></script>
  <script src="js/auth-page.js"></script>
  <script src="js/api/set-password.js"></script>
</body>
</html>
