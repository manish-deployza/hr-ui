<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create your organization — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="d-flex align-items-center justify-content-center px-3 py-5" style="min-height: 100vh;">
    <div class="signin-card signin-card-plain">
      <h1 class="signin-title">Create your organization</h1>
      <p class="signin-subtitle-plain">This creates your organization and its first admin account.</p>
      <form id="signup-form">
        <div class="mb-3">
          <label for="org-key" class="form-label">Organization Key</label>
          <input type="text" id="org-key" class="form-control" required autofocus
                 pattern="[a-z0-9_-]{1,64}" title="Lowercase letters, digits, hyphens, and underscores only"
                 placeholder="acme_corp">
          <div id="org-key-warning" class="form-text text-danger" hidden></div>
          <div class="form-text">Letters, numbers, hyphens and underscores only.</div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label for="signup-country" class="form-label">Country</label>
          <select id="signup-country" class="form-select" required>
            <option value="">Select…</option>
          </select>
          <div class="form-text">Sets your billing currency and pricing. This can't be changed later.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="signin-password-wrap">
            <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required minlength="8">
            <button type="button" class="signin-toggle-password" data-target="password" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <ul id="password-rules" class="list-unstyled small mb-0 mt-1" aria-live="polite"></ul>
        </div>
        <div class="mb-3">
          <label for="confirm-password" class="form-label">Confirm password</label>
          <div class="signin-password-wrap">
            <input type="password" id="confirm-password" class="form-control" placeholder="Repeat your password" required minlength="8">
            <button type="button" class="signin-toggle-password" data-target="confirm-password" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div class="form-check mb-1">
          <input type="checkbox" class="form-check-input" id="terms" required>
          <label class="form-check-label small" for="terms">I agree to the Terms of Service and Privacy Policy</label>
        </div>
        <div id="signup-note" class="alert alert-info small mt-2" hidden></div>
        <div class="signin-actions">
          <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </div>
        <div id="recaptcha-badge-slot" class="recaptcha-badge-slot"></div>
      </form>
      <div class="signin-footer">Already have an account? <a href="login.html">Sign In</a></div>
    </div>
  </div>

  <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-content">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <p class="loading-message">Please wait…</p>
    </div>
  </div>
  <div id="notification-stack" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/password-checks.js"></script>
  <script src="js/auth-page.js"></script>
  <script src="js/api/signup.js"></script>
</body>
</html>
