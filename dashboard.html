<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>Dashboard — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">Dashboard</h1>
        <div id="balance-cards-error" class="alert alert-danger" hidden></div>
        <div id="balance-cards" class="d-flex flex-wrap mb-4"></div>
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h2 class="h6 mb-0">Recent requests</h2>
          <a href="leave-history.html" class="small">View all</a>
        </div>
        <div id="recent-requests-error" class="alert alert-danger" hidden></div>
        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Leave type</th><th>Dates</th><th>Status</th></tr></thead>
              <tbody id="recent-requests-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/api-client-mock.js"></script>
  <script src="js/api/api-router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/status-badge.js"></script>
  <script src="js/leave-balance-card.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/page/dashboard.js"></script>
</body>
</html>
