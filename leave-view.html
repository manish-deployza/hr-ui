<!doctype html>
<html lang="en" data-auth-pending="true">
<head>
  <meta charset="utf-8">
  <title>Request Detail — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">Request detail</h1>
        <div class="card p-3 mb-3" style="max-width: 480px;">
          <dl class="row mb-0">
            <dt class="col-4">Leave type</dt><dd class="col-8" id="detail-type"></dd>
            <dt class="col-4">Dates</dt><dd class="col-8" id="detail-dates"></dd>
            <dt class="col-4">Status</dt><dd class="col-8" id="detail-status"></dd>
            <dt class="col-4">Reason</dt><dd class="col-8" id="detail-reason"></dd>
          </dl>
        </div>

        <h2 class="h6">Approval timeline</h2>
        <div id="approval-timeline" class="mb-3" style="max-width: 480px;"></div>

        <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
          <button id="approve-btn" class="btn btn-success" hidden>Approve</button>
          <button id="reject-btn" class="btn btn-outline-danger" hidden>Reject</button>
          <button id="cancel-btn" class="btn btn-outline-secondary" hidden>Cancel request</button>
        </div>
        <div id="action-error" class="alert alert-danger mt-3" hidden></div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api/api-client.js"></script>
  <script src="js/api/api-client-mock.js"></script>
  <script src="js/api/api-router.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/status-badge.js"></script>
  <script src="js/approval-timeline.js"></script>
  <script src="js/page/leave-view.js"></script>
</body>
</html>
