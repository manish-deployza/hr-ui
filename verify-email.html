<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Verify email — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="d-flex align-items-center justify-content-center px-3" style="min-height: 100vh;">
    <div class="signin-card">
      <div class="signin-brand"><i class="bi bi-envelope-check-fill"></i></div>
      <h1 class="signin-title">Verify email</h1>

      <p id="verify-pending" class="signin-subtitle">Confirming your email address…</p>

      <div id="verify-success" class="alert alert-success" hidden>
        Your email is verified. You can sign in now.
      </div>
      <div id="verify-error" class="alert alert-danger" hidden>
        This verification link is invalid or has expired. Ask your HR admin to resend it.
      </div>

      <div class="signin-actions">
        <a href="login.html" class="btn btn-primary">Go to sign in</a>
      </div>
    </div>
  </div>

  <div id="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-content">
      <div class="spinner-border text-primary" aria-hidden="true"></div>
      <p class="loading-message">Please wait…</p>
    </div>
  </div>
  <div id="notification-stack" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api/verify-email.js"></script>
</body>
</html>
