<!doctype html>
<html lang="en" data-auth-pending="true" data-access="admin">
<head>
  <meta charset="utf-8">
  <title>Billing — Employee Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="container-fluid">
    <div class="row">
      <nav class="sidebar col-md-3 col-lg-2 d-md-block">
        <div id="sidebar-placeholder"></div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pb-4">
        <h1 class="h2 pt-3 pb-2 mb-3 border-bottom">Billing</h1>
        <div id="billing-error" class="alert alert-danger" hidden></div>

        <div class="card mb-3" style="max-width: 480px;">
          <div class="card-body">
            <div class="text-body-secondary small">Current plan</div>
            <div class="h2 mb-1" id="billing-current-plan">—</div>
            <div class="text-body-secondary small" id="billing-current-status"></div>
            <button type="button" class="btn btn-outline-danger btn-sm mt-3" id="billing-cancel-btn" hidden>Cancel subscription</button>
          </div>
        </div>

        <div class="row g-3" id="billing-plans-body"></div>
      </main>
    </div>
  </div>
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/notification-bell.js"></script>
  <script src="js/api/billing.js"></script>
</body>
</html>
